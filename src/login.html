<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen · Centrum voor Emotionele Basisbehoeften</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2A3F2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@400&display=swap">
<style>
  :root { --bg: #F1EEE6; --card: #FBFAF6; --ink: #1F2622; --soft: #3A4536; --line: #D9DACF; --err: #8E3B2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
    background: var(--bg) url(/papier.png); color: var(--ink); font-family: 'Montserrat', system-ui, sans-serif;
  }
  main { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  img { width: 140px; height: auto; }
  h1 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 2rem; }
  p { margin: 0; color: var(--soft); line-height: 1.55; }
  #knop { min-height: 44px; display: flex; justify-content: center; }
  #fout { color: var(--err); font-size: 0.92rem; }
  #fout:empty { display: none; }
  a { color: var(--soft); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <img src="/logo-badge.webp?v=3" alt="Centrum voor Emotionele Basisbehoeften">
  <h1>Beheer</h1>
  <p>Log in met een beheerdersaccount om de website te bewerken.</p>
  <div id="knop"></div>
  <p id="fout" role="alert"></p>
  <a href="/">Naar de website</a>
</main>
<script>
  var CLIENT_ID = '__CLIENT_ID__';
  var fout = document.getElementById('fout');
  function inloggen(r) {
    fout.textContent = '';
    fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json', 'x-gk': '1' }, body: JSON.stringify({ credential: r.credential }) })
      .then(function (res) { return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Inloggen mislukt.'); }); })
      .then(function () { location.href = '/admin/editor'; })
      .catch(function (e) { fout.textContent = e.message; if (window.google) google.accounts.id.disableAutoSelect(); });
  }
  function start() {
    if (!CLIENT_ID) { fout.textContent = 'Inloggen is nog niet ingesteld.'; return; }
    if (!window.google || !google.accounts) { fout.textContent = 'Google-inloggen laadt niet. Ververs de pagina.'; return; }
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: inloggen, auto_select: false, ux_mode: 'popup' });
    google.accounts.id.renderButton(document.getElementById('knop'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'nl' });
  }
</script>
<script src="https://accounts.google.com/gsi/client" async onload="start()"></script>
</body>
</html>
