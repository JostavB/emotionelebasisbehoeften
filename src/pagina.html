<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITEL__ | Centrum voor Emotionele Basisbehoeften</title>
<link rel="canonical" href="https://emotionelebasisbehoeften.nl__PAD__">
<meta name="description" content="__BESCHRIJVING__">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#2A3F2E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--c-donker:#1F2622;--c-creme:#F1EEE6;--c-accent:#6E5232;--c-goud:#D2BE97;--c-tekst-zacht:#3A4536;--c-lijn:#8C7A5E;--c-salie:#A9AE96;--font-kop:'Playfair Display',Georgia,serif;--font-tekst:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--c-salie) url(/hero-aquarel.jpg) center top/cover no-repeat;min-height:100vh;color:var(--c-donker);font-family:var(--font-tekst);line-height:1.75;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 5%}
.naam{display:flex;flex-direction:column;text-decoration:none;color:var(--c-donker);font-weight:700;text-transform:uppercase;letter-spacing:.18em;line-height:1.5;font-size:12px}
.naam span:first-child{font-weight:400}
.terug{color:var(--c-donker);font-size:14px;text-underline-offset:4px}
.kaart{background:var(--c-creme) url(/papier.png);max-width:820px;margin:24px auto 0;border-radius:0 120px 0 0;padding:72px 56px 64px}
h1{font-family:var(--font-kop);font-weight:400;font-size:44px;line-height:1.15;margin:0 0 8px}
.datum{margin:0 0 36px;font-size:14px;color:var(--c-tekst-zacht)}
h2{font-family:var(--font-kop);font-weight:400;font-size:26px;line-height:1.25;margin:36px 0 8px}
p,li{color:var(--c-tekst-zacht)}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:22px}
a{color:var(--c-donker);text-underline-offset:3px}
.voet{max-width:820px;margin:0 auto;background:var(--c-creme) url(/papier.png);padding:0 56px 40px;font-size:13px;color:var(--c-tekst-zacht)}
@media (max-width:700px){.kaart{border-radius:0 56px 0 0;padding:48px 22px 36px;margin-top:8px}h1{font-size:32px}h2{font-size:22px}.voet{padding:0 22px 32px}.top{padding:16px 4%}}
__CSS__
</style>
</head>
<body>
<div class="top"><a class="naam" href="/"><span>Centrum voor</span><span>Emotionele Basisbehoeften</span></a><a class="terug" id="terug" href="/#contact">Terug naar de website</a></div>
<main class="kaart">
<h1>__TITEL__</h1>
<p class="datum">Laatst bijgewerkt: __DATUM__</p>
__INHOUD__
</main>
<div class="voet"><p>© 2026 Centrum voor Emotionele Basisbehoeften · <a href="/privacy">Privacyverklaring</a> · <a href="/disclaimer">Disclaimer</a></p></div>
<script>
document.getElementById('terug').addEventListener('click',function(e){
  try{
    if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){e.preventDefault();history.back();}
  }catch(x){}
});
</script>
</body>
</html>
